name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  create-release:
    name: create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: create release with auto-generated notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag

  macos-installers:
    name: package macOS beginner installers
    needs: create-release
    runs-on: macos-14
    permissions:
      contents: write
    env:
      SIGNING_IDENTITY: "Developer ID Application: CMORE (XC844652SJ)"
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: import Developer ID certificate
        run: |
          for name in \
            MACOS_CERTIFICATE_P12_BASE64 \
            MACOS_CERTIFICATE_PASSWORD \
            ASC_API_KEY_P8_BASE64 \
            ASC_API_KEY_ID \
            ASC_API_ISSUER_ID; do
            test -n "${!name:-}" || { echo "::error::$name is not configured"; exit 1; }
          done

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_API_KEY_ID}.p8"
          KEYCHAIN_PATH="$RUNNER_TEMP/lazy-starter-kit-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 -D > "$API_KEY_PATH"
          chmod 600 "$CERTIFICATE_PATH" "$API_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s \
            "$KEYCHAIN_PATH" \
            "$HOME/Library/Keychains/login.keychain-db"
          identities="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          case "$identities" in
            *"$SIGNING_IDENTITY"*) ;;
            *) echo "::error::Developer ID identity was not imported"; exit 1 ;;
          esac

          echo "CERTIFICATE_PATH=$CERTIFICATE_PATH" >> "$GITHUB_ENV"
          echo "API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
      - name: build, sign, notarize, and package GUI app
        run: |
          bash gui/macos/build-app.sh dist
          codesign \
            --force \
            --deep \
            --options runtime \
            --timestamp \
            --sign "$SIGNING_IDENTITY" \
            "dist/Lazy Starter Kit Installer.app"
          codesign --verify --deep --strict --verbose=2 \
            "dist/Lazy Starter Kit Installer.app"

          ditto -c -k --keepParent \
            "dist/Lazy Starter Kit Installer.app" \
            "$RUNNER_TEMP/lazy-starter-kit-notary-upload.zip"
          xcrun notarytool submit \
            "$RUNNER_TEMP/lazy-starter-kit-notary-upload.zip" \
            --key "$API_KEY_PATH" \
            --key-id "$ASC_API_KEY_ID" \
            --issuer "$ASC_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "dist/Lazy Starter Kit Installer.app"
          xcrun stapler validate "dist/Lazy Starter Kit Installer.app"
          spctl --assess --type execute --verbose=4 \
            "dist/Lazy Starter Kit Installer.app"

          ditto -c -k --keepParent \
            "dist/Lazy Starter Kit Installer.app" \
            "lazy-starter-kit-macos-gui.zip"
      - name: package double-click launcher
        run: |
          mkdir macos-double-click
          cp Install-lazy-starter-kit.command macos-double-click/
          ditto -c -k --keepParent \
            macos-double-click \
            "lazy-starter-kit-macos-double-click.zip"
      - name: upload macOS assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            lazy-starter-kit-macos-gui.zip \
            lazy-starter-kit-macos-double-click.zip \
            --repo "$GITHUB_REPOSITORY"
      - name: remove temporary signing credentials
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f \
            "${CERTIFICATE_PATH:-}" \
            "${API_KEY_PATH:-}" \
            "$RUNNER_TEMP/lazy-starter-kit-notary-upload.zip"

  windows-installers:
    name: package Windows beginner installers
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: package GUI and double-click launchers
        shell: powershell
        run: |
          Compress-Archive -Path gui\windows\installer.ps1,gui\windows\Lazy-Starter-Kit-Installer.cmd `
            -DestinationPath lazy-starter-kit-windows-gui.zip
          Compress-Archive -Path windows\Install-lazy-starter-kit.cmd `
            -DestinationPath lazy-starter-kit-windows-double-click.zip
      - name: upload Windows assets
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload $env:GITHUB_REF_NAME `
            lazy-starter-kit-windows-gui.zip `
            lazy-starter-kit-windows-double-click.zip `
            --repo $env:GITHUB_REPOSITORY

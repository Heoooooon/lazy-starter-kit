name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly (Mon 06:00 UTC) — catch upstream drift (Homebrew/tool changes)
    # even without a commit, so the kit doesn't silently bit-rot.
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: shellcheck + syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck zsh
      - name: bash syntax (3.2-safe parse)
        run: |
          for f in install.sh lib/common.sh scripts/*.sh scripts/ai/lazy-safe-rm config/zshrc.block.sh tests/*.sh; do
            bash -n "$f"
          done
      - name: shellcheck
        run: shellcheck -x -S warning -e SC2154 install.sh lib/common.sh scripts/*.sh scripts/ai/lazy-safe-rm tests/*.sh
      - name: node syntax
        run: node --check scripts/ai/shell-command-guard.js && node --check scripts/ai/install-shell-guard.js
      - name: existing Homebrew state regression
        run: tests/macos-existing-home.sh
      - name: existing ZDOTDIR regression
        run: tests/zdotdir-existing-home.sh
      - name: recursive deletion boundary regression
        run: tests/safe-recursive-delete.sh
      - name: detached update failure regression
        run: tests/update-kit.sh
      - name: AI shell guard regression
        run: tests/ai-shell-guard.sh

  lint-linux:
    name: linux shellcheck + syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: bash syntax
        run: |
          for f in linux/install.sh linux/scripts/*.sh linux/config/zshrc.block.sh; do
            bash -n "$f"
          done
      - name: shellcheck
        run: shellcheck -x -S warning -e SC2154 linux/install.sh linux/scripts/*.sh

  linux-e2e:
    name: linux install + verify (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install (non-interactive; skip Docker)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./linux/install.sh --yes --skip docker

      - name: verify installed
        run: |
          set -uo pipefail
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$HOME/.bun/bin:$HOME/.local/share/mise/shims:$PATH"
          fail=0
          need() { command -v "$1" >/dev/null 2>&1 && echo "ok   $1" || { echo "MISS $1"; fail=1; }; }
          for t in rg fd bat fzf jq gh starship mise uv bun rustup zoxide zsh; do need "$t"; done
          for t in node go python; do
            mise which "$t" >/dev/null 2>&1 && echo "ok   mise:$t" || { echo "MISS mise:$t"; fail=1; }
          done
          command -v ast-grep >/dev/null 2>&1 && echo "ok   ast-grep" || { echo "MISS ast-grep"; fail=1; }
          for t in gjc codex claude; do need "$t"; done
          grep -q 'lazy-starter-kit:main' "$HOME/.zshrc" && echo "ok   zshrc block" || { echo "MISS zshrc block"; fail=1; }
          exit $fail

      - name: install again (idempotency — "safe to re-run" is a test, not a claim)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./linux/install.sh --yes --skip docker
          fail=0
          for tag in 'lazy-starter-kit:main' 'lazy-starter-kit:ohmyzsh'; do
            n=$(grep -cxF "# >>> $tag >>>" "$HOME/.zshrc" || true)
            if [ "$n" -gt 1 ]; then echo "DUPLICATE $tag block (x$n)"; fail=1; else echo "ok   $tag block x$n"; fi
          done
          exit $fail

      - name: doctor exits 0 on a healthy install (exit code is a contract)
        run: ./linux/install.sh --doctor

  linux-e2e-distros:
    name: linux install + verify (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        image:
          - fedora:latest
          - archlinux:latest
          - opensuse/tumbleweed
    steps:
      - name: bootstrap container (git for checkout)
        shell: bash
        run: |
          set -eux
          if command -v dnf >/dev/null 2>&1; then
            dnf install -y git tar gzip
          elif command -v pacman >/dev/null 2>&1; then
            pacman -Syu --noconfirm git tar
          elif command -v zypper >/dev/null 2>&1; then
            zypper --non-interactive dup || zypper --non-interactive refresh
            zypper --non-interactive install git tar gzip
          fi
          echo "$PATH" | tr ':' '\n' >> "$GITHUB_PATH"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install (non-interactive; skip Docker)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./linux/install.sh --yes --skip docker

      - name: verify installed
        run: |
          set -uo pipefail
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$HOME/.bun/bin:$HOME/.local/share/mise/shims:$PATH"
          fail=0
          need() { command -v "$1" >/dev/null 2>&1 && echo "ok   $1" || { echo "MISS $1"; fail=1; }; }
          for t in rg fd bat fzf jq gh starship mise uv bun rustup zoxide zsh; do need "$t"; done
          for t in node go python; do
            mise which "$t" >/dev/null 2>&1 && echo "ok   mise:$t" || { echo "MISS mise:$t"; fail=1; }
          done
          command -v ast-grep >/dev/null 2>&1 && echo "ok   ast-grep" || { echo "MISS ast-grep"; fail=1; }
          for t in gjc codex claude; do need "$t"; done
          grep -q 'lazy-starter-kit:main' "$HOME/.zshrc" && echo "ok   zshrc block" || { echo "MISS zshrc block"; fail=1; }
          exit $fail

      - name: doctor exits 0 on a healthy install (exit code is a contract)
        run: ./linux/install.sh --doctor

  linux-upgrade-path:
    name: linux upgrade path (latest tag -> main)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: install from the newest release tag
        env:
          HERMES: "0"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tag=$(git tag --sort=-v:refname | head -1)
          echo "installing from $tag"
          git worktree add /tmp/kit-old "$tag"
          /tmp/kit-old/linux/install.sh --yes --skip docker

      - name: upgrade — re-run the current (main) kit on top
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./linux/install.sh --yes --skip docker

      - name: verify upgraded state
        run: |
          set -uo pipefail
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$HOME/.bun/bin:$HOME/.local/share/mise/shims:$PATH"
          fail=0
          for t in rg fd bat fzf jq gh starship mise uv bun rustup zsh gjc codex claude; do
            command -v "$t" >/dev/null 2>&1 && echo "ok   $t" || { echo "MISS $t"; fail=1; }
          done
          for tag in 'lazy-starter-kit:main' 'lazy-starter-kit:ohmyzsh'; do
            n=$(grep -cxF "# >>> $tag >>>" "$HOME/.zshrc" || true)
            if [ "$n" -gt 1 ]; then echo "DUPLICATE $tag block (x$n)"; fail=1; else echo "ok   $tag block x$n"; fi
          done
          exit $fail

  lint-windows:
    name: windows powershell parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: parse all .ps1 (PowerShell is preinstalled on the runner)
        shell: pwsh
        run: |
          $fail = 0
          @(Get-ChildItem -Path windows,gui/windows -Recurse -Include *.ps1) + @(
            Get-Item tests/windows-safe-remove.ps1,tests/windows-install-entrypoints.ps1
          ) | ForEach-Object {
            $tokens = $null; $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $fail = 1
              Write-Host "FAIL $($_.FullName)"
              $errors | ForEach-Object { Write-Host "  $($_.Message) (line $($_.Extent.StartLineNumber))" }
            } else { Write-Host "ok   $($_.Name)" }
          }
          exit $fail
      - name: PSScriptAnalyzer (warnings+errors)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $res = Invoke-ScriptAnalyzer -Path windows -Recurse -Severity Warning,Error
          $res += Invoke-ScriptAnalyzer -Path gui/windows -Recurse -Severity Warning,Error
          $res | Format-Table -AutoSize
          if ($res | Where-Object { $_.Severity -eq 'Error' }) { exit 1 }

  dryrun:
    name: macOS dry-run
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: beginner installer entrypoints
        run: tests/install-entrypoints.sh
      - name: release signing contract
        run: tests/release-signing.sh
      - run: HERMES=1 ./install.sh --dry-run

  integration:
    name: macOS install + verify
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: existing ZDOTDIR regression
        run: tests/zdotdir-existing-home.sh

      - name: install (non-interactive)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./install.sh

      - name: verify installed
        run: |
          set -euo pipefail
          eval "$(/opt/homebrew/bin/brew shellenv)"
          export PATH="$HOME/.local/share/mise/shims:$HOME/.bun/bin:$HOME/.local/bin:/opt/homebrew/opt/rustup/bin:$PATH"
          fail=0
          need() { command -v "$1" >/dev/null 2>&1 && echo "ok   $1" || { echo "MISS $1"; fail=1; }; }
          for t in mise starship rg fd fzf bat gh colima zoxide node python go rustc gjc codex claude; do need "$t"; done
          echo "node:   $(node -v)"
          echo "python: $(python --version)"
          echo "go:     $(go version)"
          echo "codex:  $(codex --version 2>/dev/null | head -1 || echo '?')"
          test -d "$HOME/.oh-my-zsh" || { echo "MISS oh-my-zsh"; fail=1; }
          grep -q 'lazy-starter-kit:main' "$HOME/.zshrc" || { echo "MISS zshrc block"; fail=1; }
          test -d "$HOME/.codex/plugins/cache/sisyphuslabs/omo" && echo "ok   lazycodex/omo" || echo "warn lazycodex/omo not found"
          exit $fail

      - name: install again (idempotency — "safe to re-run" is a test, not a claim)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./install.sh
          fail=0
          for spec in "lazy-starter-kit:main:$HOME/.zshrc" "lazy-starter-kit:ohmyzsh:$HOME/.zshrc" "lazy-starter-kit:brew:$HOME/.zprofile"; do
            tag="${spec%:*}"; file="${spec##*:}"
            n=$(grep -cxF "# >>> $tag >>>" "$file" || true)
            if [ "$n" -gt 1 ]; then echo "DUPLICATE $tag block (x$n)"; fail=1; else echo "ok   $tag block x$n"; fi
          done
          exit $fail

      - name: doctor exits 0 on a healthy install (exit code is a contract)
        run: ./install.sh --doctor

  windows-e2e:
    name: windows install + verify
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: safe recursive delete regression (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\windows-safe-remove.ps1

      - name: beginner installer entrypoints
        shell: powershell
        run: .\tests\windows-install-entrypoints.ps1

      - name: safe recursive delete regression (PowerShell 7)
        shell: pwsh
        run: .\tests\windows-safe-remove.ps1

      - name: check winget (preinstalled on windows-2025 image)
        shell: pwsh
        run: winget --version

      - name: install (non-interactive; skip Docker Desktop; Hermes n/a on Windows)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .\windows\install.ps1 -Yes -Skip docker

      - name: verify installed
        shell: pwsh
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' +
                      [Environment]::GetEnvironmentVariable('Path','User') + ';' +
                      "$env:USERPROFILE\.cargo\bin;$env:USERPROFILE\.bun\bin;$env:USERPROFILE\.local\bin;$env:LOCALAPPDATA\mise\shims"
          $fail = 0
          function need($c) {
            if (Get-Command $c -ErrorAction SilentlyContinue) { Write-Host "ok   $c" }
            else { Write-Host "MISS $c"; $script:fail = 1 }
          }
          foreach ($t in 'git','gh','jq','rg','fd','bat','fzf','starship','mise','uv','rustup','bun','zoxide') { need $t }
          & mise reshim 2>$null
          foreach ($t in 'node','go','python') {
            $p = (& mise which $t 2>$null)
            if ($p) { Write-Host "ok   mise:$t" } else { Write-Host "warn mise:$t not resolved" }
          }
          & mise reshim 2>$null
          $env:Path += ";$env:LOCALAPPDATA\mise\shims;$env:USERPROFILE\.bun\bin;$env:USERPROFILE\.local\bin"
          foreach ($t in 'gjc','codex','claude') {
            if (Get-Command $t -ErrorAction SilentlyContinue) { Write-Host "ok   $t" }
            else { Write-Host "MISS $t"; $fail = 1 }
          }
          $prof = $PROFILE.CurrentUserAllHosts
          if ((Test-Path $prof) -and (Select-String -Path $prof -SimpleMatch 'lazy-starter-kit:main' -Quiet)) {
            Write-Host "ok   profile block"
          } else { Write-Host "MISS profile block"; $fail = 1 }
          exit $fail

  cron-failure-alert:
    name: alert on scheduled-run failure
    runs-on: ubuntu-latest
    needs: [lint, lint-linux, linux-e2e, linux-e2e-distros, linux-upgrade-path, lint-windows, dryrun, integration, windows-e2e]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      - name: open or bump the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create ci-drift --repo "$REPO" --color D93F0B \
            --description "weekly scheduled CI failed — upstream drift" --force
          existing=$(gh issue list --repo "$REPO" --label ci-drift --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "The weekly drift check failed again: $RUN_URL"
          else
            gh issue create --repo "$REPO" --label ci-drift \
              --title "Weekly drift check failed — an upstream likely changed" \
              --body "The scheduled CI run (which exists to catch Homebrew/installer/distro drift without a commit) failed. Logs: $RUN_URL"
          fi
